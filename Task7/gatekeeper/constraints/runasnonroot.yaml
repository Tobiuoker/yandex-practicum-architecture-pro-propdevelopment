apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredSecurityContext
metadata:
  name: require-nonroot-and-readonly
spec:
  enforcementAction: deny
  match:
    scope: Namespaced
    namespaces:
      - audit-zone
    kinds:
      - apiGroups:
          - ""
        kinds:
          - Pod
